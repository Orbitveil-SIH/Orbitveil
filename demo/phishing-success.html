<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verification Complete</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #f7fbff, #edf5ff);
      font-family: Arial, sans-serif;
      color: #0f172a;
    }

    .card {
      width: min(92vw, 560px);
      background: #fff;
      border: 1px solid #dfe7f3;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      padding: 32px 28px;
      text-align: center;
    }

    .icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #dcfce7;
      color: #166534;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      font-size: 42px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    p {
      margin: 0;
      line-height: 1.7;
      color: #475569;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Verification complete</h1>
    <p>
      Your account has been successfully verified and the security review has been completed.
    </p>
  </div>
</body>
</html>
